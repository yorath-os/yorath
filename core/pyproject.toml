[project]
name = "yorath"
version = "0.1.0"
description = "Yorath core: control, runtime and enforcement planes in one FastAPI process"
authors = [
    { name = "Yorath", email = "hello@yorath.io" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "cedarpy>=4.12.2",
    "cryptography>=46",
    "docker>=7.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "mcp>=2.3,<3",
    "pgvector>=0.5.1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.10",
    "pypdf>=6.21.4",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
yorath = "yorath.cli:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]  # scenario tables read better on one line

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "group: the whole core on a live Postgres, stubs only at the boundary",
    "covers(*ids): invariants from tests/invariants.md that the test checks",
]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "openai>=3.46.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261103",
]
