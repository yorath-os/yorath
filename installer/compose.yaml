# Yorath: Docker Compose. Image versions and limits come from .env, generated by
# `make render-env` from distribution.yaml (decision 22). Profiles: dev (sources), prod (images).
name: yorath

services:
  db:
    image: ${YORATH_IMAGE_POSTGRES}
    environment:
      POSTGRES_USER: ${YORATH_DB_USER:-yorath}
      POSTGRES_PASSWORD: ${YORATH_DB_PASSWORD:-yorath}
      POSTGRES_DB: ${YORATH_DB_NAME:-yorath}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${YORATH_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${YORATH_DB_USER:-yorath} -d ${YORATH_DB_NAME:-yorath}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  ollama:
    image: ${YORATH_IMAGE_OLLAMA}
    environment:
      OLLAMA_KEEP_ALIVE: ${YORATH_OLLAMA_KEEP_ALIVE}
      OLLAMA_MAX_LOADED_MODELS: ${YORATH_OLLAMA_MAX_LOADED_MODELS}
      OLLAMA_CONTEXT_LENGTH: ${YORATH_OLLAMA_CONTEXT_LENGTH}
      # Ollama does not set --cache-ram, and the llama.cpp prompt RAM cache defaults to 8 GB, more than the container limit
      LLAMA_ARG_CACHE_RAM: ${YORATH_OLLAMA_CACHE_RAM_MIB:-0}
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "127.0.0.1:${YORATH_OLLAMA_PORT:-11434}:11434"
    # spike local-model-cpu: the llama.cpp prompt cache grows without limit; OOM must hit Ollama, not core/db
    mem_limit: ${YORATH_OLLAMA_MEM_LIMIT}
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  core:
    image: ${YORATH_IMAGE_CORE:-yorath-core:${YORATH_VERSION}}
    build:
      context: ..
      dockerfile: installer/Dockerfile.core
      args:
        PYTHON_IMAGE: ${YORATH_IMAGE_PYTHON}
    environment:
      YORATH_DATABASE_URL: postgresql+asyncpg://${YORATH_DB_USER:-yorath}:${YORATH_DB_PASSWORD:-yorath}@db:5432/${YORATH_DB_NAME:-yorath}
      YORATH_OLLAMA_URL: http://ollama:11434
      YORATH_BUILD_SHA: ${YORATH_BUILD_SHA:-unknown}
      YORATH_SETUP_CODE: ${YORATH_SETUP_CODE:-}
      YORATH_SECRET_KEY: ${YORATH_SECRET_KEY:-}
      YORATH_GPU_NAME: ${YORATH_GPU_NAME:-}
      YORATH_GPU_VRAM_GB: ${YORATH_GPU_VRAM_GB:-}
      YORATH_GPU_COUNT: ${YORATH_GPU_COUNT:-}
      YORATH_COOKIE_SECURE: ${YORATH_COOKIE_SECURE:-false}
      YORATH_DOCUMENTS_DIR: /data/documents
      YORATH_SANDBOX_DIR: ${YORATH_SANDBOX_DIR:-/var/lib/yorath/sandbox}
      YORATH_SANDBOX_URL: http://sandbox-runner:8090
      YORATH_SANDBOX_TOKEN: ${YORATH_SANDBOX_TOKEN:-}
      YORATH_NODE_TOKEN: ${YORATH_NODE_TOKEN:-}
      YORATH_EGRESS_LOG: /data/egress/access.log
      YORATH_CODEX_SANDBOX: ${YORATH_CODEX_SANDBOX:-danger-full-access}
      YORATH_GITHUB_API_URL: ${YORATH_GITHUB_API_URL:-https://api.github.com}
      # internet access through a proxy (install.sh YORATH_EGRESS_PROXY); empty means direct
      HTTPS_PROXY: ${YORATH_EGRESS_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,ollama,db,web,core,sandbox-runner,egress-proxy
    volumes:
      - documents-data:/data/documents
      # yorath scan report from the host (agents outside Yorath): the core cannot see host processes
      - ./.host-report:/host-report:ro
      - agents-data:/app/agents/custom
      # the same path in the core, runner and sandbox: absolute paths in the Codex config are valid everywhere
      - ${YORATH_SANDBOX_DIR:-/var/lib/yorath/sandbox}:${YORATH_SANDBOX_DIR:-/var/lib/yorath/sandbox}
      - egress-logs:/data/egress:ro
      - egress-node-logs:/data/egress-node:ro
    # the core is not in sandnet: the sandbox sees only /gateway/v1 through the egress proxy (squid.conf).
    # In the agents network the core is the only neighbor of connected agents: they see only core:8000
    networks:
      default:
      agents:
        aliases: [core]
    # bootstrap: migrations, built-in policies, agents from agents/, node inventory, then the API
    command: ["sh", "-c", "yorath bootstrap && yorath serve"]
    ports:
      - "127.0.0.1:${YORATH_CORE_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      # /health returns 503 until Ollama is ready; a core response is enough for container readiness
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/version', timeout=3); sys.exit(0 if r.status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  web:
    image: ${YORATH_IMAGE_WEB:-yorath-web:${YORATH_VERSION}}
    build:
      context: ..
      dockerfile: installer/Dockerfile.web
      args:
        NODE_IMAGE: ${YORATH_IMAGE_NODE}
        CADDY_IMAGE: ${YORATH_IMAGE_CADDY}
    ports:
      - "${YORATH_WEB_BIND:-127.0.0.1}:${YORATH_WEB_PORT:-8080}:80"
    environment:
      YORATH_SITE: ${YORATH_SITE:-:80}
      YORATH_TLS_DIRECTIVE: ${YORATH_TLS_DIRECTIVE:-}
      YORATH_CADDY_EMAIL: ${YORATH_CADDY_EMAIL:-}
      YORATH_CADDY_SNI: ${YORATH_CADDY_SNI:-}
      YORATH_CA_FILE: ${YORATH_CA_FILE:-none}
    volumes:
      # certificates and the internal CA key survive container re-creation
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      # Caddy admin API: a process check, independent of the TLS mode and the https redirect
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  # developer profile: the Developer Agent sandbox; the base install does not start it.
  sandbox-runner:
    profiles: ["developer"]
    image: ${YORATH_IMAGE_CORE:-yorath-core:${YORATH_VERSION}}
    command: ["yorath", "sandbox-runner"]
    environment:
      YORATH_SANDBOX_TOKEN: ${YORATH_SANDBOX_TOKEN:-}
      YORATH_SANDBOX_IMAGE: yorath-sandbox:${YORATH_VERSION}
      YORATH_SANDBOX_RUNTIME: ${YORATH_SANDBOX_RUNTIME:-runsc}
      YORATH_SANDBOX_NETWORK: yorath_sandnet
      YORATH_SANDBOX_DIR: ${YORATH_SANDBOX_DIR:-/var/lib/yorath/sandbox}
    volumes:
      # the only service with the Docker socket: it sets the image, runtime and network itself
      - /var/run/docker.sock:/var/run/docker.sock
      - ${YORATH_SANDBOX_DIR:-/var/lib/yorath/sandbox}:${YORATH_SANDBOX_DIR:-/var/lib/yorath/sandbox}
    restart: unless-stopped

  # node service (change connected-agents): containers of connected agents following the core's desired
  # state; images only from the distribution.yaml catalog baked into its image
  node-agent:
    image: ${YORATH_IMAGE_CORE:-yorath-core:${YORATH_VERSION}}
    command: ["yorath", "node-agent"]
    environment:
      YORATH_NODE_TOKEN: ${YORATH_NODE_TOKEN:-}
      YORATH_NODE_CORE_URL: http://core:8000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # agent internet denials: a file in the node proxy volume
      - egress-state:/var/lib/yorath-egress
    depends_on:
      core:
        condition: service_healthy
    restart: unless-stopped

  # node proxy (change node-egress, decision 36): all node HTTP/HTTPS is sent here by the rules in
  # installer/egress/yorath.nft; in the host network, uid proxy (13) is excluded from interception
  egress:
    image: yorath-egress:${YORATH_VERSION}
    build:
      context: ..
      dockerfile: installer/Dockerfile.egress
      args:
        YORATH_IMAGE_UBUNTU: ${YORATH_IMAGE_UBUNTU:-ubuntu:24.04}
        YORATH_SQUID_VERSION: ${YORATH_SQUID_VERSION:-6.14}
    network_mode: host
    volumes:
      - ./egress/squid.conf:/etc/squid/squid.conf:ro
      - egress-state:/var/lib/yorath-egress
      - egress-node-logs:/var/log/yorath-egress
    restart: always

  egress-proxy:
    profiles: ["developer"]
    image: ${YORATH_IMAGE_SQUID}
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
      - ./egress-allow.txt:/etc/squid/egress-allow.txt:ro
      - egress-logs:/var/log/squid
    networks:
      default:
      sandnet:
        ipv4_address: 172.30.0.2
    restart: unless-stopped

  sandbox-image:
    profiles: ["build-sandbox"]
    image: yorath-sandbox:${YORATH_VERSION}
    build:
      context: ..
      dockerfile: installer/Dockerfile.sandbox
      args:
        CODEX_VERSION: ${YORATH_CODEX_VERSION}

networks:
  # connected agents network: addresses are fixed (distribution.yaml connected_agents.*.address),
  # outbound traffic is held by node egress control (HTTP/HTTPS via the proxy, everything else blocked)
  agents:
    name: yorath_agents
    ipam:
      config:
        - subnet: 172.31.0.0/24
  # internal: sandbox containers have no route outside, egress only through the proxy
  sandnet:
    name: yorath_sandnet
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  db-data:
  documents-data:
  agents-data:
  egress-logs:
  egress-state:
  egress-node-logs:
  ollama-data:
  caddy_data:
  caddy_config:
