# Sandbox egress: domains from egress-allow.txt and the core Model Gateway. Everything else gets 403 and is logged.
http_port 3128
acl sandbox src 172.30.0.0/24
acl allowed dstdomain "/etc/squid/egress-allow.txt"
# the core is not in sandnet: of its whole API the sandbox can reach only the Gateway (plain HTTP, path visible)
acl core_gw dstdomain core
acl core_port port 8000
acl gw_path urlpath_regex ^/gateway/v1/
# no `..` and no encoded `.`, `/`, `\`: the path must not escape /gateway/v1 after normalization
acl gw_escape urlpath_regex -i \.\. %2e %2f %5c
acl ssl_ports port 443
acl CONNECT method CONNECT
http_access deny CONNECT !ssl_ports
http_access deny sandbox core_gw gw_escape
http_access allow sandbox core_gw core_port gw_path !CONNECT
http_access allow sandbox allowed
http_access deny all
cache deny all
access_log stdio:/var/log/squid/access.log
pid_filename /run/squid.pid
