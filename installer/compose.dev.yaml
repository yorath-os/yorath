# Development profile: docker compose -f compose.yaml -f compose.dev.yaml up
# Core with reload from sources; web is the vite dev server proxying to core.
services:
  core:
    build:
      target: dev
    volumes:
      - ../core/src:/app/core/src:ro
      - ../core/alembic:/app/core/alembic:ro
      - ../distribution.yaml:/app/distribution.yaml:ro
    command: ["sh", "-c", "yorath bootstrap && yorath serve --reload"]
  web:
    image: ${YORATH_IMAGE_NODE}
    build: !reset null
    working_dir: /app
    volumes:
      - ../web:/app
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0 --port 80"]
    environment:
      VITE_API_PROXY: http://core:8000
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 20
