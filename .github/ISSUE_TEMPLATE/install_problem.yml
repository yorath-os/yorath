name: Install problem
description: The install command or the setup wizard failed.
labels: [install]
body:
  - type: dropdown
    id: step
    attributes:
      label: At which step
      options:
        - The install command (curl … | sh)
        - Opening the wizard link
        - In the setup wizard
        - The first question in Chat
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Terminal output
      description: The last 30 lines of the installer output, or a screenshot of the browser.
      render: text
    validations:
      required: true
  - type: textarea
    id: diag
    attributes:
      label: Diagnostics
      description: |
        If the `yorath` command exists, run `yorath diag` and attach the archive.
        Otherwise attach the output of:
        `cd /opt/yorath && docker compose --project-directory installer -f installer/compose.yaml ps`
        `docker compose --project-directory installer -f installer/compose.yaml logs --tail 100 core`
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server
      description: OS, CPUs, memory, GPU — for example "Ubuntu 24.04, 8 vCPU, 16 GB, no GPU".
