name: close pull requests

# Yorath does not accept pull requests (see CONTRIBUTING.md): each one is closed with a pointer to
# issues and discussions. pull_request_target runs this file from main; the code of the pull request
# is never checked out or run.
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-24.04
    steps:
      - name: comment and close
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr close "$PR" --repo "$REPO" --comment "Thank you for the contribution. Yorath is developed in a private repository and published here release by release, so pull requests are not merged. Please open an issue or a discussion instead: https://github.com/$REPO/blob/main/CONTRIBUTING.md"
