# Yorath distribution manifest (Requirements §6, decision 22).
# The single source of versions: Compose and the core read it instead of duplicating it.
# Versions are pinned from measurements on real servers.

distribution:
  name: yorath
  version: 0.7.0 # x-release-please-version
  schema_version: "0005_instance_channels" # Alembic head revision in core/alembic/versions

images:
  postgres: pgvector/pgvector:pg17
  ollama: ollama/ollama:0.40.14
  python: python:3.14-slim
  node: node:24-alpine
  caddy: caddy:2.11.7-alpine          # entry point with automatic TLS (change model-endpoint)
  squid: ubuntu/squid:6.13-25.04_edge
  ubuntu: ubuntu:24.04                 # base of yorath-egress: Squid with OpenSSL, HTTPS interception by SNI (change node-egress)

egress:
  squid: "6.14"                        # squid-openssl from Ubuntu 24.04; the yorath-egress build fails on any other version

runtimes:
  codex_cli: "0.166.0"                 # spike gvisor-vps: npm @openai/codex
  openclaw: null                       # live run: runtime-adapter-codex (stage 5)
  runsc: "release-20261102.0"          # spike gvisor-vps: gVisor apt repository, systrap platform

# Connected agents (change connected-agents, decision 34): the tested version is installed by
# default, the owner may pick another tag from the same repository. The image is pulled on
# connect, not at install time. Address: 172.31.0.<address> in the yorath_agents network.
connected_agents:
  openclaw:
    repository: ghcr.io/openclaw/openclaw
    version: "2026.11.3"
    digest: sha256:e73f689d663567f0fe3c5a85c54beb3e102dc21f0814bf375e9039ee2d2df51b
    port: 18789
    health_path: /healthz
    model_name: openclaw/default
    address: 10
    state_dir: /home/node/.openclaw
    user: "1000:1000"
    command: ["node", "openclaw.mjs", "gateway", "--bind", "lan", "--port", "18789"]
    memory_mb: 3072                   # 1.7 GB when idle (run 12.11.2026)
    homepage: https://openclaw.ai
  hermes:
    repository: nousresearch/hermes-agent
    version: v0.23.1
    digest: sha256:276d44685c65c0cb2a25f190b63c65c8906f9dc76486fb1c05ae71b5826bda08
    port: 8642
    health_path: /health
    model_name: hermes-agent
    address: 11
    state_dir: /opt/data
    # s6-overlay: init runs as root, does chown and drops processes to hermes (uid 10000)
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    command: ["gateway", "run"]
    memory_mb: 2048
    homepage: https://hermes-agent.nousresearch.com

models:
  embeddings: embeddinggemma-2:570m
  default_cpu: gemma4:e2b
  default_gpu: qwen3.5:9b
  quality_cpu: qwen3.5:4b              # the "quality over speed" choice without a GPU
  default_external: openai/gpt-5.6-luna  # OpenRouter, Public/Internal only, with explicit consent
  by_hardware:                         # §6 matrix from the spike local-model-cpu measurements
    - tier: below_minimum
      min_vcpu: 0
      min_ram_gb: 0
      local_mode: false
      note: OpenRouter only
    - tier: minimum
      min_vcpu: 4
      min_ram_gb: 8
      local_mode: true
      model: gemma4:e2b
      expected_answer_seconds: 19
      reranking: false
    - tier: acceptable
      min_vcpu: 8
      min_ram_gb: 8
      local_mode: true
      model: gemma4:e2b
      expected_answer_seconds: 12
      reranking: false
    - tier: recommended
      min_vcpu: 16
      min_ram_gb: 16
      local_mode: true
      model: gemma4:e2b
      expected_answer_seconds: 8
      reranking: false
    - tier: gpu
      min_vcpu: 4
      min_ram_gb: 8
      min_vram_gb: 16                  # A10 "24 GB" reports 23028 MiB → the installer writes 22; qwen3.5:9b with a 32768 window peaks at 6.8 GB
      local_mode: true
      model: qwen3.5:9b
      expected_answer_seconds: 2
      reranking: true
  catalog:                             # measured footprint (change model-memory-budgets): rss_gb is the runner peak on CPU at num_ctx 4096
    gemma4:e2b:
      params_b: 4.6
      file_gb: 3.3
      rss_gb: 5.0
      vram_gb: 4.6
      measured_on: "bench q104, 30 questions, 8 vCPU, cache-ram 0, peak 5.02 GB, 5.11.2026; A10 4.11.2026"
    qwen3.5:4b:
      params_b: 4.2
      file_gb: 2.5
      rss_gb: 3.8
      vram_gb: 2.8
      measured_on: "bench q104, 99 questions, 8 vCPU, cache-ram 0, peak 3.82 GB, 5.11.2026; A10 4.11.2026"
    qwen3.5:9b:
      params_b: 9.0
      file_gb: 5.2
      vram_gb: 5.7
      measured_on: "A10, 4.11.2026; not measured on CPU"
    embeddinggemma-2:570m:
      params_b: 0.57
      file_gb: 0.6
      rss_gb: 0.6
      vram_gb: 0.6
      measured_on: "spike local-model-cpu, 3.11.2026"
  memory:
    reserve_gb: 1                      # core, database, web and OS next to Ollama
    unknown_factor: 1.3                # model outside the catalog: file_gb × factor + KV of the closest known one

ollama:                                # limits from the spike: the llama.cpp prompt cache grows until OOM
  mem_limit: 7g                        # lower bound; the installer takes node RAM − models.memory.reserve_gb (7 GB on 8 GB, 31 GB on 32 GB)
  keep_alive: 5m
  max_loaded_models: 2
  context_length: 4096                 # model context window on CPU (Model Resource.context_length)
  context_length_gpu: 65536            # context window on a GPU node: OpenClaw and Hermes need ≥64k

journal:                               # Requirements §8, decision 28: traces are time-limited, audit is not
  trace_retention_days: 30

rag:                                   # spike local-model-cpu: contextual chunking + vector/full-text RRF
  chunk_chars: 900
  chunk_overlap: 150
  top_k: 5
  candidates: 50
  rrf_k: 60
  fts_config: russian
  embedding_dim: 768                   # embeddinggemma-2:570m; changing the model means reindexing and a migration
  min_similarity: 0.7                  # hit relevance: on topic ≥ 0.75, off topic ≤ 0.66 (embeddinggemma-2, spike corpus)

gateway:                               # single PEP point (decision 21): timeouts and the Execution token for sandbox runtimes
  model_timeout_seconds: 300           # a CPU answer takes up to 60 s on Docker Desktop, 19 s on the minimal VPS
  model_first_token_seconds: 120       # OpenRouter once stayed silent for 300 s, a retry went through in 8 s (gvisor-vps.md)
  tool_timeout_seconds: 60
  model_queue_max: 100                 # calls waiting for one local model (decision 44); more gets queue_full (429)
  model_queue_wait_seconds: 120        # wait for a free model server; then queue_timeout (503)
  max_output_tokens: 2048              # without it OpenRouter reserves the model maximum (65536) and answers 402 on a low balance
  execution_token_ttl_minutes: 120

agent_loop:                            # own loop (decision 4): a step is one model call
  max_steps: 6
  timeout_seconds: 600                 # an ask_agent chain on CPU: child loop up to 181 s plus the parent's steps
  first_step_nudge: true               # an answer without tools on the first step → one retry with a hint
